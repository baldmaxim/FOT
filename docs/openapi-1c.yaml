openapi: 3.1.0

info:
  title: FOT — API закрытых табелей для 1С
  version: 1.0.0
  description: |
    Обмен закрытыми согласованными табелями между ФОТ и 1С.

    ## Модель данных

    Единица обмена — **подача табеля** (`approval_id`): отдел за период либо
    персональная подача руководителя «по людям». Подача живёт вечно, а её
    содержимое версионируется.

    **Закрытый согласованный табель — неизменяемый официальный снимок.**
    В момент утверждения и при каждом повторном закрытии ФОТ сохраняет версию:
    состав сотрудников, часы по дням, итоги. API отдаёт табель только из
    сохранённой версии и никогда не пересчитывает его на лету. Фоновый пересчёт
    СКУД закрытую версию не меняет — чтобы правки дошли до 1С, табель нужно
    открыть и закрыть заново.

    В штатном прикладном процессе новая редакция создаётся **только** при
    согласовании и при закрытии табеля: править закрытый табель «напрямую» в ФОТ
    не может никто, включая администраторов. Отдельно существует аварийная
    пересборка (`rebuild`) — редкая административная процедура восстановления
    после ручной правки данных.

    **Пока табель открыт для правок, он продолжает отдаваться 1С** с последней
    официально закрытой редакцией: подача не исчезает из выдачи, а незавершённые
    правки в неё не попадают.

    ## Цикл обмена

    1. `GET /timesheets?needs_export=true` — что нужно забрать (опрос раз в минуту).
    2. `GET /timesheets/{approval_id}` — полный табель нужной версии.
    3. Запись или обновление документа в 1С (свой документ ищется по `approval_id`).
    4. `POST /timesheets/{approval_id}/ack` — подтверждение принятой `revision`.

    ## revision и content_hash

    - `revision` — номер официальной редакции табеля, растёт с каждой новой версией.
    - `content_hash` — md5 содержимого версии.

    Открытие и закрытие табеля **без фактических правок** новую версию не создаёт —
    лишнего перепроведения не будет. Если `revision` вырос, а `content_hash` совпал
    с уже принятым, документ можно не перепроводить, но **ACK новой `revision`
    отправить обязательно** — иначе табель навсегда останется в состоянии `stale`.

    ## Идентификация сотрудников

    Сопоставление — **только по `identity.employee_id`** (постоянный код сотрудника
    в ФОТ). В справочнике сотрудников 1С заводится уникальный реквизит `ID_FOT`.
    Полные однофамильцы существуют, поэтому сопоставление по ФИО недопустимо:
    ФИО — исключительно для отображения. `tab_number` заполнен не у всех и не
    уникален — как ключ не использовать.

    ## Аутентификация

    Заголовок `Authorization: Bearer fot_<prefix>_<secret>`. Токен выдаётся один
    раз при создании ключа в админке ФОТ «API-доступ». Ключу должна быть открыта
    таблица `employees`, а для `ack` — включён флаг «Разрешить подтверждение
    выгрузки табелей».
  contact:
    name: ФОТ, администратор API
    url: https://fot.su10.ru

servers:
  - url: https://fot.su10.ru/api/public/v1
    description: Прод (HTTPS)
  - url: http://fot.su10.ru/api/public/v1
    description: Прод (HTTP, только для старых релизов 1С без OpenSSL)

security:
  - bearerAuth: []

tags:
  - name: timesheets
    description: Закрытые согласованные табели — список, выгрузка, подтверждение.
  - name: legacy
    description: Ранее существовавшие методы. Расчёт на лету, без версионирования.
  - name: dismissals
    description: Увольнение из 1С ЗУП3 — приказ, компенсация отпуска и выходное пособие (запись в ФОТ).
  - name: employees
    description: Справочник сотрудников — ID_FOT, код физлица 1С, ФИО, дата рождения; по нему 1С проставляет ID_FOT.
  - name: staff-month
    description: |
      Сотрудники месяца для ЗУП3: основной объект, факт и норма часов, категория (рабочий / ИТР / офис), дни с
      объектами, бригады и справочник объектов. Один снимок месяца на обход (snapshot_id).

paths:
  /timesheets:
    get:
      tags: [timesheets]
      operationId: listTimesheets
      summary: Список закрытых согласованных табелей
      description: |
        Лёгкий метод для регулярного опроса — табель не собирается, всё читается
        из сохранённых версий. Отдаёт подачи в статусе «утверждён», у которых есть
        сохранённая версия. Открытый для правок табель из выдачи **не исчезает** —
        он отдаётся с последней официально закрытой редакцией.

        Ровно одна строка на подачу (`approval_id`), с последней редакцией.
        Повторные циклы «открыть → закрыть» не создают дублей и не возвращают
        прежние редакции отдельными табелями.

        Пагинация — **keyset**: повторяйте запрос с `cursor` из `next_cursor`,
        пока тот не станет `null`. Параметра `offset` нет намеренно: после ACK
        строки уходят из выборки `needs_export=true`, и смещение пропускало бы
        сдвинувшиеся записи.

        Единственное исключение — табель, для которого идёт аварийная пересборка
        версии: он в выдачу **не попадает вообще**, ни с фильтром, ни без него, и
        вернётся, когда пересборка закончится. Случай редкий: его вызывает только
        ручное восстановление данных администратором БД.
      parameters:
        - $ref: '#/components/parameters/Month'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - name: department_id
          in: query
          description: |
            UUID отдела; несколько — через запятую. Фильтрует **только подачи
            отдела**. Персональные подачи руководителей (`scope.kind = personal`)
            под этот фильтр не попадают — забирайте их запросом без параметра.
          schema:
            type: string
        - name: needs_export
          in: query
          description: |
            `true` — только те, что нужно забрать (`not_exported` + `stale`).
            `false` — только уже принятые (`exported`).
            Параметр опущен — все.
          schema:
            type: boolean
        - name: limit
          in: query
          description: Размер страницы.
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - name: cursor
          in: query
          description: Значение `next_cursor` из предыдущего ответа. Непрозрачная строка.
          schema:
            type: string
      responses:
        '200':
          description: Страница списка
          content:
            application/json:
              schema:
                type: object
                required: [period, data, meta, next_cursor]
                properties:
                  period:
                    $ref: '#/components/schemas/Period'
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TimesheetListItem'
                  meta:
                    type: object
                    required: [without_version]
                    properties:
                      without_version:
                        type: integer
                        description: |
                          Сколько подач в выборке ещё не имеют сохранённой версии.
                          В норме 0. Ненулевое значение — сигнал администратору
                          ФОТ, что нужен прогон backfill; такие строки приходят
                          с `version_available: false`.
                  next_cursor:
                    type: [string, 'null']
                    description: Курсор следующей страницы; `null` — данные кончились.
              examples:
                page:
                  summary: Одна подача к выгрузке
                  value:
                    period:
                      month: '2026-08'
                      start: '2026-08-01'
                      end: '2026-08-15'
                    data:
                      - approval_id: 855
                        scope:
                          kind: department
                          department_id: 0e2c9f3a-1b4d-4c8e-9a10-2f3b4c5d6e7f
                          department_name: бр. Иванова
                          manager_employee_id: null
                        start_date: '2026-08-01'
                        end_date: '2026-08-15'
                        version_available: true
                        revision: 2
                        content_hash: d41d8cd98f00b204e9800998ecf8427e
                        employees_count: 28
                        total_hours: 3248.5
                        version_created_at: '2026-08-16T09:12:44.000Z'
                        state: stale
                        last_export:
                          revision: 1
                          acked_at: '2026-08-16T06:03:11.000Z'
                          document_ref: ТАБ-000123
                    meta:
                      without_version: 0
                    next_cursor: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /timesheets/{approval_id}:
    get:
      tags: [timesheets]
      operationId: getTimesheetVersion
      summary: Полный табель из сохранённой версии
      description: |
        Возвращает **весь согласованный состав** подачи целиком, без фильтров:
        `employees_count` и `content_hash` всегда соответствуют отданному телу.

        Решение «импортировать сотрудника или нет» принимает 1С по флагу
        `zero_activity`: в документ попадают строки с `zero_activity: false`.
      parameters:
        - $ref: '#/components/parameters/ApprovalId'
        - name: revision
          in: query
          description: |
            Конкретная редакция. По умолчанию — последняя. Поле `state` всегда
            считается по последней редакции, даже если запрошена старая.
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Табель версии
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimesheetVersionPayload'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            Табель недоступен для выгрузки: не утверждён
            (`TIMESHEET_NOT_APPROVED`), версия ещё не сформирована
            (`VERSION_NOT_AVAILABLE`) либо идёт аварийная пересборка
            (`TIMESHEET_REBUILD_PENDING`).
            Во всех случаях — пропустить и повторить в следующем цикле.

            Открытый для правок табель сюда НЕ относится: он отдаётся обычным
            образом, с последней официально закрытой редакцией.

            `TIMESHEET_REBUILD_PENDING` возвращается и при запросе конкретной
            старой редакции: пока формируется новая, отдавать прежние часы нельзя.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                rebuildPending:
                  value:
                    success: false
                    code: TIMESHEET_REBUILD_PENDING
                    error: Табель пересчитывается — попробуйте в следующем цикле
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /timesheets/{approval_id}/objects:
    get:
      tags: [timesheets]
      operationId: getTimesheetObjectBreakdown
      summary: Часы сотрудников по объектам (та же редакция)
      description: |
        Отвечает на вопрос «на каком объекте и сколько часов был сотрудник».
        Нужен там, где учёт идёт по СКУД: день складывается из проходов по
        нескольким объектам, и в теле табеля этой разбивки нет.

        Метод читает снимок, **замороженный вместе с редакцией**, и ничего не
        пересчитывает — повторный запрос той же `revision` даёт тот же
        `objects_content_hash`.

        Вызывать **с той же `revision`**, что забрали в
        `GET /timesheets/{approval_id}`: между двумя вызовами может появиться
        новая редакция.

        Инвариант: сумма `objects[*].days[дата]` равна `days[дата].hours` того же
        сотрудника в теле табеля. Часы — в той же шкале, что и в табеле.

        Разбивка есть не у всех отделов. Если объектной активности нет, часы
        приходят одной строкой «Не определён» либо `objects` пуст — это не ошибка.
      parameters:
        - $ref: '#/components/parameters/ApprovalId'
        - name: revision
          in: query
          description: Конкретная редакция. По умолчанию — последняя.
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Объектная разбивка редакции
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectBreakdown'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            Разбивка недоступна. Коды `TIMESHEET_NOT_APPROVED`,
            `VERSION_NOT_AVAILABLE`, `TIMESHEET_REBUILD_PENDING` — как у самого
            табеля. Плюс два своих:

            `OBJECT_BREAKDOWN_NOT_AVAILABLE` — редакция старше внедрения метода и
            не забэкфиллена. Пропустить.

            `INVALID_EXPORT_MODE_CONFIG` — у части сотрудников повреждён режим
            табелирования, их часы недостоверны. В поле `employees` — список
            `employee_id` с причиной; передать администратору ФОТ. Снимок
            заморожен, поэтому починка настройки сама редакцию не исправит —
            табель нужно открыть и закрыть заново.

            **В обоих случаях ACK отправлять НЕЛЬЗЯ:** подача уйдёт из очереди,
            а объектные строки в документ так и не попадут.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notAvailable:
                  value:
                    success: false
                    code: OBJECT_BREAKDOWN_NOT_AVAILABLE
                    error: Объектная разбивка для этой редакции не сформирована
                invalidConfig:
                  value:
                    success: false
                    code: INVALID_EXPORT_MODE_CONFIG
                    error: Разбивка по объектам недостоверна
                    employees:
                      - employee_id: 501
                        code: PINNED_OBJECT_MISSING
                        message: Режим «объект» без закреплённого объекта
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /timesheets/{approval_id}/managers:
    get:
      tags: [timesheets]
      operationId: getTimesheetManagers
      summary: Руководитель отдела по каждому сотруднику (та же редакция)
      description: |
        Кто у сотрудника начальник отдела. Поле `manager_employee_id` в теле табеля для
        этого не годится — это **подавший табель** руководитель, а не начальник человека.

        Отдаётся руководитель **того отдела, к которому сотрудник относится в этом
        табеле**. Руководители родительских отделов, «ответственные согласующие» и
        подбор по должности не используются: они подставили бы начальника из чужого
        подразделения.

        Метод читает снимок, **замороженный вместе с редакцией**, и ничего не резолвит:
        повторный запрос той же `revision` даёт тот же `managers_content_hash`.
        Вызывать с той же `revision`, что и табель.

        `managers: []` со статусом `not_configured` — **штатный результат**, а не ошибка:
        на момент внедрения руководитель не назначен ни у «ЛИНИЯ», ни у «ЛИНИЯ-Общестрой».

        Сопоставлять руководителя **только по `employee_id`** (реквизит `ID_FOT`).
      parameters:
        - $ref: '#/components/parameters/ApprovalId'
        - name: revision
          in: query
          description: Конкретная редакция. По умолчанию — последняя.
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Руководители отдела для редакции
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagersResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            Коды `TIMESHEET_NOT_APPROVED`, `VERSION_NOT_AVAILABLE`,
            `TIMESHEET_REBUILD_PENDING` — как у самого табеля. Плюс свой:

            `MANAGERS_NOT_AVAILABLE` — редакция старше внедрения метода и не дозаполнена.
            Пропустить, **ACK не отправлять**: иначе подача уйдёт из очереди без
            руководителей.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notAvailable:
                  value:
                    success: false
                    code: MANAGERS_NOT_AVAILABLE
                    error: Руководители для этой редакции не сформированы
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /timesheets/{approval_id}/ack:
    post:
      tags: [timesheets]
      operationId: ackTimesheetVersion
      summary: Подтвердить приём версии
      description: |
        Отправляется **после** успешной записи документа в 1С.

        Идемпотентен: повторный ACK той же `revision` возвращает исходный
        `acked_at` и не создаёт вторую запись — безопасно повторять после обрыва
        связи. ACK на устаревшую редакцию отклоняется с `REVISION_MISMATCH`:
        значит, табель успели переоткрыть и поправить — перечитайте его и
        обработайте заново.

        `content_hash`, `employees_count` и `total_hours` сервер берёт из своей
        версии; передавать их не нужно.

        Требует у ключа флага «Разрешить подтверждение выгрузки табелей» —
        это единственный метод API, который пишет данные.
      parameters:
        - $ref: '#/components/parameters/ApprovalId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AckRequest'
            examples:
              basic:
                value:
                  revision: 2
                  document_ref: ТАБ-000123
      responses:
        '200':
          description: Версия принята (или уже была принята ранее)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AckResult'
              examples:
                ok:
                  value:
                    success: true
                    approval_id: 855
                    revision: 2
                    content_hash: d41d8cd98f00b204e9800998ecf8427e
                    state: exported
                    acked_at: '2026-08-16T10:20:31.000Z'
                    document_ref: ТАБ-000123
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            Ключу не открыта таблица `employees` либо не включён флаг
            «Разрешить подтверждение выгрузки табелей».
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            `REVISION_MISMATCH` — подтверждается не последняя редакция
            (в теле придут `current_revision` и `current_content_hash`);
            `TIMESHEET_REBUILD_PENDING` — идёт аварийная пересборка версии:
            подтверждать прежнюю уже нечего;
            `TIMESHEET_NOT_APPROVED` — подача больше не утверждена;
            `VERSION_NOT_AVAILABLE` — указанной редакции нет.

            Открытый для правок табель подтверждать МОЖНО: 1С подтверждает ту
            редакцию, которую ей отдали, а появление следующей переведёт подачу
            в `stale` по обычному протоколу.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                mismatch:
                  value:
                    success: false
                    code: REVISION_MISMATCH
                    error: Подтверждается устаревшая редакция табеля
                    current_revision: 3
                    current_content_hash: 9e107d9d372bb6826bd81d3542a419d6
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /timesheet:
    get:
      tags: [legacy]
      operationId: getDepartmentTimesheetLive
      summary: Расчётный табель отдела за произвольный период (без версионирования)
      description: |
        Существующий метод, оставлен без изменений для обратной совместимости.
        Считает табель **на лету**, поэтому не даёт ни заморозки, ни признака
        изменения. Для регулярного обмена используйте `/timesheets`.
      parameters:
        - name: department_id
          in: query
          required: true
          description: UUID отдела; несколько — через запятую. Поддерево не раскрывается.
          schema:
            type: string
        - name: month
          in: query
          required: true
          schema:
            type: string
            pattern: ^\d{4}-\d{2}$
        - name: half
          in: query
          description: Половина месяца. По умолчанию `FULL`.
          schema:
            type: string
            enum: [FULL, H1, H2]
            default: FULL
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: Расчётный табель
          content:
            application/json:
              schema:
                type: object
                properties:
                  period:
                    $ref: '#/components/schemas/Period'
                  departments:
                    type: array
                    items:
                      type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /employee-events:
    get:
      tags: [legacy]
      operationId: getEmployeeEvents
      summary: События СКУД по сотруднику
      description: |
        Время, направление и точка доступа. ФИО и номер карты в контракт не входят.
        Требует открытой ключу таблицы `skud_events`.
      parameters:
        - name: employee_id
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          description: Период не длиннее 366 дней.
          schema:
            type: string
            format: date
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 500
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: События
          content:
            application/json:
              schema:
                type: object
                properties:
                  period:
                    type: object
                  data:
                    type: array
                    items:
                      type: object
                  pagination:
                    type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /employees:
    get:
      tags: [employees]
      operationId: listEmployeesDirectory
      summary: Справочник сотрудников — ID_FOT, код физлица 1С, ФИО, дата рождения
      description: |
        Свои сотрудники СУ-10 и СМ без подрядчиков, работающие и уволенные с 01.06.2026 — те же, что в «сотрудниках
        месяца». По возрастанию employee_id, страница — `after_id` = `next_after_id`. Нужен доступ ключа к таблице `employees`.
      parameters:
        - name: id_all
          in: query
          description: Код физлица 1С (UUID).
          schema:
            type: string
            format: uuid
        - name: employee_id
          in: query
          schema:
            type: integer
            minimum: 1
        - name: status
          in: query
          schema:
            type: string
            enum: [active, fired]
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 500
        - name: after_id
          in: query
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Страница справочника.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    const: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DirectoryEmployee'
                  meta:
                    type: object
                    properties:
                      count:
                        type: integer
                      with_id_all:
                        type: integer
                  next_after_id:
                    type: [integer, 'null']
        '400':
          $ref: '#/components/responses/StaffMonthError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /staff-month:
    get:
      tags: [staff-month]
      operationId: getStaffMonthEmployees
      summary: Сотрудники половины месяца или месяца — объект, часы, категория, объект табелирования, дни
      description: |
        `half=1` (1–15) или `half=2` (16–конец) — половина со статусом выгрузки; без `half` — месяц целиком, только
        чтение, без статусов. Закрытый день — последняя редакция согласованной подачи; живой — только если закрытого
        нет (`source = live`). Факт — часы `work`, `manual`, `remote`, `sick_worked`, `study_day`; у неявок 0.
        Страницы одного обхода читают один снимок: курсор держит `snapshot_id`, половину и параметры отбора.
        Нужен доступ ключа к таблице `employees`.
      parameters:
        - $ref: '#/components/parameters/StaffMonth'
        - $ref: '#/components/parameters/StaffMonthHalf'
        - name: object_key
          in: query
          description: UUID объекта, `office` или `unknown`. Основной объект или фактические часы на нём.
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
            enum: [worker, itr, office]
        - name: employee_id
          in: query
          schema:
            type: integer
            minimum: 1
        - name: days
          in: query
          description: '`1` — добавить `days[]`.'
          schema:
            type: string
            enum: ['0', '1', 'true', 'false']
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - name: cursor
          in: query
          schema:
            type: string
        - name: export_state
          in: query
          description: |
            Только с `half` (без него — 400 `invalid_filter`). Статусы через запятую: `not_ready`, `ready`, `exported`,
            `changed`. «Что забрать» — `ready,changed`; в этом режиме приходят и надгробия (`present: false`).
          schema:
            type: string
        - $ref: '#/components/parameters/StaffMonthSnapshot'
      responses:
        '200':
          description: Страница сотрудников.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StaffMonthEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/StaffMonthEmployee'
        '400':
          $ref: '#/components/responses/StaffMonthError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/StaffMonthError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/StaffMonthBuilding'
  /staff-month/ack:
    post:
      tags: [staff-month]
      operationId: ackStaffMonth
      summary: Подтвердить приём строк половины месяца в ЗУП3
      description: |
        Подтверждаются `state_revision` и `content_hash` из `GET /staff-month` с тем же `half` (у надгробия хеш `null`).
        Подтверждение половины другую половину не трогает. Проверка — по сохранённым версиям, не по снимку. Нужен ключ
        с разрешением подтверждения (как у обмена табелями).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [month, half, employees]
              properties:
                month:
                  type: string
                half:
                  type: integer
                  enum: [1, 2]
                  description: 1 — 1–15, 2 — 16–конец месяца.
                document_ref:
                  type: [string, 'null']
                  maxLength: 200
                employees:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items:
                    type: object
                    required: [employee_id, state_revision, content_hash]
                    properties:
                      employee_id:
                        type: integer
                      state_revision:
                        type: integer
                        minimum: 1
                      content_hash:
                        type: [string, 'null']
                        pattern: '^[0-9a-f]{64}$'
      responses:
        '200':
          description: Принятые и отклонённые строки.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    const: true
                  accepted:
                    type: array
                    items:
                      type: object
                      properties:
                        employee_id:
                          type: integer
                        state_revision:
                          type: integer
                        acked_at:
                          type: string
                          format: date-time
                  rejected:
                    type: array
                    items:
                      type: object
                      properties:
                        employee_id:
                          type: integer
                        state_revision:
                          type: integer
                        code:
                          type: string
                          enum: [not_found, hash_mismatch, not_ready]
        '400':
          $ref: '#/components/responses/StaffMonthError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /payroll/dismissals:
    post:
      tags: [dismissals]
      operationId: postDismissals
      summary: Увольнение из 1С — приказ, компенсация отпуска, выходное пособие
      description: |
        Документ «Увольнение» ЗУП3. Версии — по `source_revision`, распроведение — `posted: false`, исправление —
        `supersedes_guid`. Суммы — строкой с двумя знаками, начисление до удержаний. Право ключа —
        `allow_payroll_dismissal_import`. `dry_run=1` — без записи. Подробно — раздел «Увольнение из 1С» API_1C.md.
      parameters:
        - name: dry_run
          in: query
          schema:
            type: string
            enum: ['0', '1', 'true', 'false']
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [documents]
              properties:
                documents:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items:
                    type: object
                    required: [guid, source_revision, posted]
                    properties:
                      guid:
                        type: string
                        format: uuid
                      source_revision:
                        type: integer
                        minimum: 1
                      posted:
                        type: boolean
                      supersedes_guid:
                        type: [string, 'null']
                        format: uuid
                      number:
                        type: string
                      date:
                        type: string
                        format: date
                      month:
                        type: string
                        pattern: '^\d{4}-(0[1-9]|1[0-2])$'
                      organization_inn:
                        type: string
                        enum: ['7736255508', '7705794997']
                      employee:
                        type: object
                        required: [employee_id, id_all]
                        properties:
                          employee_id:
                            type: integer
                          id_all:
                            type: string
                            format: uuid
                          full_name:
                            type: string
                      order:
                        type: object
                        required: [dismissal_date]
                        properties:
                          dismissal_date:
                            type: string
                            format: date
                          basis:
                            type: [string, 'null']
                            maxLength: 200
                      accruals:
                        type: object
                        required: [vacation_compensation, severance]
                        properties:
                          vacation_compensation:
                            type: string
                            pattern: '^\d{1,10}\.\d{2}$'
                          vacation_compensation_days:
                            type: [string, 'null']
                          severance:
                            type: string
                            pattern: '^\d{1,10}\.\d{2}$'
      responses:
        '200':
          description: Результат по каждому документу.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    const: true
                  dry_run:
                    type: boolean
                  documents:
                    type: array
                    items:
                      type: object
                      properties:
                        index:
                          type: integer
                        guid:
                          type: string
                        action:
                          type: string
                          enum: [new, updated, unposted, unchanged, stale]
                        employee_id:
                          type: [integer, 'null']
                        month:
                          type: [string, 'null']
                        cells:
                          type: array
                          items:
                            type: object
                            properties:
                              item:
                                type: string
                                enum: [vacation_compensation, severance]
                              before:
                                type: [string, 'null']
                              after:
                                type: [string, 'null']
                        warnings:
                          type: array
                          items:
                            type: object
                            properties:
                              code:
                                type: string
                                enum: [fot_not_dismissed, fot_dismissal_date_differs, id_all_missing_in_fot, month_differs_from_dismissal]
                              message:
                                type: string
        '400':
          description: '`invalid_body`, `unknown_employee`, `employee_mismatch`, `revision_conflict`, `supersedes_conflict`; `errors[]` — index, guid, path.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: '`busy` — документ сейчас принимается, повторить через `Retry-After`.'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /staff-month/brigades:
    get:
      tags: [staff-month]
      operationId: getStaffMonthBrigades
      summary: Бригады месяца и их объект
      description: |
        Объект бригады — с наибольшими фактическими часами всех её людей за месяц, «Не определён» не выбирается
        (`null`, если других часов нет).
      parameters:
        - $ref: '#/components/parameters/StaffMonth'
        - $ref: '#/components/parameters/StaffMonthHalf'
        - $ref: '#/components/parameters/StaffMonthSnapshot'
      responses:
        '200':
          description: Бригады.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StaffMonthEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/StaffMonthBrigade'
        '400':
          $ref: '#/components/responses/StaffMonthError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/StaffMonthError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/StaffMonthBuilding'
  /staff-month/objects:
    get:
      tags: [staff-month]
      operationId: getStaffMonthObjects
      summary: Объекты месяца — справочник и итоги
      description: |
        Строка есть, если на объекте есть фактические часы или он основной хотя бы у одного сотрудника — то же
        правило, что у отбора `object_key`. `office` и `unknown` входят.
      parameters:
        - $ref: '#/components/parameters/StaffMonth'
        - $ref: '#/components/parameters/StaffMonthHalf'
        - $ref: '#/components/parameters/StaffMonthSnapshot'
      responses:
        '200':
          description: Объекты.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StaffMonthEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/StaffMonthObjectTotals'
        '400':
          $ref: '#/components/responses/StaffMonthError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/StaffMonthError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/StaffMonthBuilding'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        `Authorization: Bearer fot_<16 hex>_<48 hex>`.
        Токен выдаётся один раз при создании ключа; при утере создаётся новый.

  parameters:
    ApprovalId:
      name: approval_id
      in: path
      required: true
      description: Постоянный идентификатор подачи табеля. По нему 1С находит свой документ.
      schema:
        type: integer
        minimum: 1

    Month:
      name: month
      in: query
      description: |
        Месяц `YYYY-MM`. **Взаимоисключающ с `from`/`to`** — передача обоих
        вариантов даёт 400. Глубина запроса ограничена 3 месяцами от текущего.
      schema:
        type: string
        pattern: ^\d{4}-\d{2}$

    From:
      name: from
      in: query
      description: Начало произвольного диапазона `YYYY-MM-DD`. Используется вместе с `to`.
      schema:
        type: string
        format: date

    To:
      name: to
      in: query
      description: Конец произвольного диапазона `YYYY-MM-DD`. Используется вместе с `from`.
      schema:
        type: string
        format: date

    StaffMonth:
      name: month
      in: query
      required: true
      description: '`YYYY-MM`, не раньше `2026-06`, не будущий (по Москве).'
      schema:
        type: string
        pattern: '^\d{4}-(0[1-9]|1[0-2])$'
    StaffMonthHalf:
      name: half
      in: query
      description: |
        `1` — 1–15, `2` — 16–конец месяца. Не передан — месяц целиком (без статусов). Вторая половина текущего месяца
        до 16-го — 400 `half_not_started`.
      schema:
        type: string
        enum: ['1', '2']
    StaffMonthSnapshot:
      name: snapshot_id
      in: query
      description: Снимок месяца из `snapshot.id` — читать из него же. Удалён — 409 `snapshot_expired`.
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: |
        Некорректные параметры: одновременно `month` и `from`/`to`, превышение
        глубины запроса, битый `cursor`, отсутствие обязательного поля.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Токен отсутствует, неверен, отозван или просрочен.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Ключу не открыт нужный доступ.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Объект не найден.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: |
        Превышен лимит запросов ключа (по умолчанию 60 в минуту, настраивается).
        Выдержите окно и повторите.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    StaffMonthError:
      description: |
        `400 invalid_month | month_not_supported | invalid_filter | half_not_started | invalid_cursor` — не повторять;
        `409 snapshot_expired` — начать обход заново без `cursor` и `snapshot_id`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StaffMonthErrorBody'
    StaffMonthBuilding:
      description: |
        `snapshot_building` — снимок месяца собирается (до минуты), `calculation_failed` — сборка не удалась.
        Повторить через `Retry-After` секунд.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StaffMonthErrorBody'
  schemas:
    ExportState:
      type: string
      enum: [not_exported, stale, exported]
      description: |
        `not_exported` — версия ещё не подтверждена 1С;
        `stale` — принята более ранняя редакция, появилась новая;
        `exported` — последняя редакция принята.

    Period:
      type: object
      properties:
        month:
          type: [string, 'null']
        start:
          type: string
          format: date
        end:
          type: string
          format: date

    Scope:
      type: object
      description: |
        Область подачи. `department` — табель отдела или бригады;
        `personal` — персональная подача руководителя «по людям»,
        у неё `department_id` пуст.
      required: [kind]
      properties:
        kind:
          type: string
          enum: [department, personal]
        department_id:
          type: [string, 'null']
          format: uuid
        department_name:
          type: [string, 'null']
        manager_employee_id:
          type: [integer, 'null']

    LastExport:
      type: [object, 'null']
      description: Последнее подтверждение от 1С; `null`, если подтверждений не было.
      properties:
        revision:
          type: integer
        acked_at:
          type: string
          format: date-time
        document_ref:
          type: [string, 'null']

    TimesheetListItem:
      type: object
      required: [approval_id, scope, start_date, end_date, version_available, state]
      properties:
        approval_id:
          type: integer
        scope:
          $ref: '#/components/schemas/Scope'
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        version_available:
          type: boolean
          description: |
            `false` — версия ещё не сформирована; тогда `revision`,
            `content_hash`, `employees_count`, `total_hours`,
            `version_created_at` и `last_export` равны `null`,
            а `state` — `not_exported`. Такой табель выгрузить нельзя,
            повторите в следующем цикле.
        revision:
          type: [integer, 'null']
        content_hash:
          type: [string, 'null']
        employees_count:
          type: [integer, 'null']
        total_hours:
          type: [number, 'null']
        version_created_at:
          type: [string, 'null']
          format: date-time
        state:
          $ref: '#/components/schemas/ExportState'
        last_export:
          $ref: '#/components/schemas/LastExport'

    EmployeeIdentity:
      type: object
      description: Идентификаторы сотрудника. Сопоставляйте **только по `employee_id`**.
      required: [employee_id]
      properties:
        employee_id:
          type: integer
          description: Постоянный код сотрудника в ФОТ. Реквизит `ID_FOT` в 1С.
        sigur_employee_id:
          type: [integer, 'null']
          description: Идентификатор в СКУД Sigur. Резервный, для сверки.
        tab_number:
          type: [string, 'null']
          description: |
            Табельный номер. Заполнен не у всех и не уникален —
            **ключом сопоставления быть не может**.
        full_name:
          type: [string, 'null']
          description: |
            Только для отображения. Полные однофамильцы существуют —
            сопоставление по ФИО приведёт к ошибке.

    DayValue:
      type: object
      required: [status, hours]
      properties:
        status:
          type: string
          enum: [work, manual, remote, vacation, sick, dayoff, unpaid, absent, educational_leave, sick_worked, study_day]
          description: |
            Машинный код дня. Перечень зеркалит TimeStatus в
            fot-server/src/types/index.ts — при добавлении статуса править оба места.
            Отработанное время: work (СКУД или подтверждённая корректировка), manual
            (часы проставлены вручную), remote (удалёнка). Засчитаны по норме графика:
            sick_worked (работал на больничном), study_day (учебный день). Неявки:
            vacation, sick, dayoff, unpaid (за свой счёт), absent, educational_leave.
            Удалённые значения business_trip и study больше не приходят.
        hours:
          type: number
          description: |
            Часы за день, как в согласованном табеле. У неявок здесь норма планового
            графика, а НЕ отработанное время: переносить их как отработанные нельзя.
            Отработанные часы берутся только у work, manual и remote, причём при
            hours = 0 день не считается явкой ни при каком статусе.
        corrected:
          type: boolean
          description: День получен или изменён ручной корректировкой.
        hours_overridden:
          type: boolean
          description: Часы заданы вручную поверх СКУД.

    TimesheetEmployee:
      type: object
      required: [identity, total_hours, days, zero_activity]
      properties:
        identity:
          $ref: '#/components/schemas/EmployeeIdentity'
        position:
          type: [string, 'null']
        total_hours:
          type: number
        zero_activity:
          type: boolean
          description: |
            `true` — за период нет ни одного реального сигнала (ни проходов,
            ни корректировок, ни объектной активности). **В документ 1С такие
            строки не переносятся** — это соответствует правилу «не проходящие
            по СКУД не попадают в 1С». Строка «Начальник участка» всегда
            приходит с `false`.
        days:
          type: object
          description: Ключ — дата `YYYY-MM-DD`.
          additionalProperties:
            $ref: '#/components/schemas/DayValue'
        object_rows:
          type: array
          description: |
            Историческое зарезервированное поле. **Всегда пусто и останется пустым.**
            Разбивка часов по объектам живёт отдельным методом
            `GET /timesheets/{approval_id}/objects`: класть её сюда нельзя —
            изменился бы `content_hash`, и все уже выгруженные табели пришлось бы
            перезабирать.
          items:
            type: object

    ObjectRow:
      type: object
      required: [object_id, object_name, total_hours, days]
      properties:
        object_id:
          type: [string, 'null']
          format: uuid
          description: |
            `null` у «Текущей деятельности» и у нераспознанного объекта
            («Не определён») — различать по `object_name`.
        object_key:
          type: string
          description: Внутренний ключ строки. Стабилен между редакциями.
        object_name:
          type: string
          example: ЖК Примавера К14
        object_address:
          type: string
          description: Адрес объекта (`alt_name`), иначе его название.
        total_hours:
          type: number
          description: Сумма по `days` этой строки.
        days:
          type: object
          description: |
            Ключ — дата `YYYY-MM-DD`, значение — часы. Только дни с
            положительными часами: дни-буквы (отпуск, больничный) и
            несогласованные выходные сюда не попадают — они уже описаны в теле
            табеля, и дублировать их значит задвоить учёт.
          additionalProperties:
            type: number

    EmployeeObjects:
      type: object
      required: [employee_id, mode, total_hours, objects]
      properties:
        employee_id:
          type: integer
          description: Тот же ключ, что `identity.employee_id` в табеле (реквизит `ID_FOT`).
        full_name:
          type: [string, 'null']
          description: Только для отображения.
        mode:
          type: string
          enum: [skud, object, current_activity]
          description: |
            `skud` — разбивка по фактическим проходам; `object` — одна строка на
            закреплённый объект; `current_activity` — одна строка «Текущая
            деятельность».
        total_hours:
          type: number
        objects:
          type: array
          description: Пусто, если у сотрудника нет дней с положительными часами. Не ошибка.
          items:
            $ref: '#/components/schemas/ObjectRow'

    ObjectBreakdown:
      type: object
      required:
        [approval_id, revision, timesheet_content_hash, objects_content_hash, employees]
      properties:
        approval_id:
          type: integer
        scope:
          $ref: '#/components/schemas/Scope'
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        revision:
          type: integer
          description: Редакция, к которой относится разбивка.
        timesheet_content_hash:
          type: string
          description: |
            `content_hash` самой редакции — сверяется с тем, что вернул
            `GET /timesheets/{approval_id}`.
        objects_content_hash:
          type: string
          description: |
            Хэш объектной разбивки. **Может измениться при неизменном
            `timesheet_content_hash`** — если часы переставили между объектами,
            а итог дня остался прежним. Такое изменение всегда даёт новую
            `revision`, поэтому подача штатно вернётся в `needs_export`.
        version_created_at:
          type: string
          format: date-time
        employees:
          type: array
          items:
            $ref: '#/components/schemas/EmployeeObjects'
        meta:
          type: object
          properties:
            employees_count:
              type: integer

    ManagerRef:
      type: object
      required: [employee_id, source]
      properties:
        employee_id:
          type: integer
          description: |
            **Единственный ключ сопоставления** (реквизит `ID_FOT`). Запись присутствует
            всегда, даже если метаданные не нашлись, — пропавший id был бы неотличим от
            «руководителя нет».
        full_name:
          type: [string, 'null']
          description: Только для отображения. `null` — метаданные не найдены.
        employment_status:
          type: [string, 'null']
        is_archived:
          type: [boolean, 'null']
        source:
          type: string
          enum: [department_full_access]
          description: |
            Активное ручное назначение доступа к отделу. Отдельного поля «руководитель
            отдела» в системе нет, поэтому источник назван по факту, а не по смыслу.
        data_quality_issues:
          type: array
          description: Проблемы записи. Непустой список = автоматически использовать нельзя.
          items:
            type: string
            enum: [manager_metadata_missing, manager_dismissed, manager_archived, manager_name_looks_test]

    EmployeeManagers:
      type: object
      required: [employee_id, resolution_status, managers]
      properties:
        employee_id:
          type: integer
        full_name:
          type: [string, 'null']
        department_id:
          type: [string, 'null']
          format: uuid
        department_name:
          type: [string, 'null']
        resolution_basis:
          type: string
          enum: [approval_department, employee_assignment_period]
          description: Откуда взят отдел — из подачи отдела или из истории назначений за период.
        resolution_status:
          type: string
          enum: [resolved, multiple, not_configured, department_unknown, invalid_configuration]
          description: |
            `resolved` — один пригодный; `multiple` — несколько, **первого брать нельзя**;
            `not_configured` — отдел известен, руководитель не назначен (норма);
            `department_unknown` — отдел определить не удалось (проблема данных);
            `invalid_configuration` — назначения есть, но ни одного пригодного.
        managers:
          type: array
          items:
            $ref: '#/components/schemas/ManagerRef'
        data_quality_issues:
          type: array
          items:
            type: string
            enum: [department_changed_during_period, department_history_missing, department_unknown]

    ManagersResponse:
      type: object
      required: [approval_id, revision, timesheet_content_hash, managers_content_hash, employees]
      properties:
        approval_id:
          type: integer
        scope:
          $ref: '#/components/schemas/Scope'
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        revision:
          type: integer
        timesheet_content_hash:
          type: string
        managers_content_hash:
          type: string
          description: |
            Меняется при смене руководителя даже когда часы прежние. Такое изменение
            всегда даёт новую `revision` — сверять нужно все три хэша.
        version_created_at:
          type: string
          format: date-time
        snapshot_source:
          type: string
          enum: [materialize, backfill_current_state]
          description: |
            `materialize` — состояние на момент создания редакции;
            `backfill_current_state` — на момент дозаполнения старых редакций, то есть
            заведомо позже закрытия табеля. Истории назначений руководителей в системе
            нет, поэтому «руководитель на даты табеля» не гарантируется ни в одном случае.
        resolved_at:
          type: string
          format: date-time
        employees:
          type: array
          items:
            $ref: '#/components/schemas/EmployeeManagers'
        meta:
          type: object
          properties:
            employees_count:
              type: integer
            without_manager:
              type: integer

    TimesheetVersionPayload:
      type: object
      required: [approval, revision, content_hash, employees_count, total_hours, employees, state]
      properties:
        approval:
          type: object
          properties:
            id:
              type: integer
            scope:
              $ref: '#/components/schemas/Scope'
            start_date:
              type: string
              format: date
            end_date:
              type: string
              format: date
            status:
              type: string
        revision:
          type: integer
        content_hash:
          type: string
        version_created_at:
          type: string
          format: date-time
        employees_count:
          type: integer
          description: Число сотрудников в этом теле — весь согласованный состав.
        total_hours:
          type: number
        state:
          $ref: '#/components/schemas/ExportState'
        employees:
          type: array
          items:
            $ref: '#/components/schemas/TimesheetEmployee'

    AckRequest:
      type: object
      required: [revision]
      properties:
        revision:
          type: integer
          minimum: 1
          description: Редакция, которая записана в 1С.
        document_ref:
          type: string
          maxLength: 128
          description: Номер документа в 1С — попадает в журнал и в интерфейс ФОТ.
        note:
          type: string
          maxLength: 500

    AckResult:
      type: object
      properties:
        success:
          type: boolean
        approval_id:
          type: integer
        revision:
          type: integer
        content_hash:
          type: string
        state:
          $ref: '#/components/schemas/ExportState'
        acked_at:
          type: string
          format: date-time
          description: |
            Время первого подтверждения этой редакции. При повторном ACK
            возвращается прежнее значение.
        document_ref:
          type: [string, 'null']

    ErrorResponse:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
        error:
          type: string
          description: Человекочитаемое описание.
        code:
          description: |
            `TIMESHEET_VERSION_INCOMPLETE` — версию собрать не удалось, состав
            подачи неполон: нужно вмешательство администратора ФОТ.

            `TIMESHEET_UNLOCKED` больше не возвращается — открытый для правок
            табель отдаётся как обычно. Код оставлен в перечне для совместимости
            с уже написанными обработчиками.
          type: [string, 'null']
          enum: [TIMESHEET_UNLOCKED, TIMESHEET_NOT_APPROVED, TIMESHEET_REBUILD_PENDING, VERSION_NOT_AVAILABLE, REVISION_MISMATCH, TIMESHEET_VERSION_INCOMPLETE, null]
        current_revision:
          type: integer
          description: Только для `REVISION_MISMATCH` — актуальная редакция.
        current_content_hash:
          type: string
          description: Только для `REVISION_MISMATCH`.

    StaffMonthErrorBody:
      type: object
      required: [success, code, error, retryable]
      properties:
        success:
          const: false
        code:
          type: string
          enum: [invalid_month, month_not_supported, invalid_filter, half_not_started, invalid_cursor, invalid_body, forbidden, snapshot_expired, snapshot_building, calculation_failed, internal_error]
        error:
          type: string
        retryable:
          type: boolean
    StaffMonthObject:
      type: object
      required: [key, id, name, address]
      description: Одинаковый во всех трёх методах.
      properties:
        key:
          type: string
          description: UUID объекта, `office` или `unknown`.
        id:
          type: [string, 'null']
        name:
          type: string
        address:
          type: [string, 'null']
    StaffMonthObjectHours:
      type: object
      required: [object, hours]
      properties:
        object:
          $ref: '#/components/schemas/StaffMonthObject'
        hours:
          type: number
    DirectoryEmployee:
      type: object
      properties:
        employee_id:
          type: integer
          description: ID_FOT.
        id_all:
          type: [string, 'null']
          format: uuid
          description: Код физлица 1С; null — в ФОТ не заполнен.
        full_name:
          type: [string, 'null']
        last_name:
          type: [string, 'null']
        first_name:
          type: [string, 'null']
        middle_name:
          type: [string, 'null']
        birth_date:
          type: [string, 'null']
          format: date
        tab_number:
          type: [string, 'null']
        organization:
          type: [object, 'null']
          properties:
            inn:
              type: string
            name:
              type: string
        department:
          type: [object, 'null']
          properties:
            id:
              type: string
            name:
              type: string
        position:
          type: [string, 'null']
        hire_date:
          type: [string, 'null']
          format: date
        dismissal_date:
          type: [string, 'null']
          format: date
        status:
          type: string
          enum: [active, fired]
    StaffMonthEnvelope:
      type: object
      required: [success, period, snapshot, data, meta, next_cursor]
      properties:
        success:
          const: true
        period:
          type: object
          properties:
            month:
              type: string
            half:
              type: [integer, 'null']
              enum: [1, 2, null]
            from:
              type: string
              format: date
            to:
              type: string
              format: date
            as_of:
              type: string
              format: date
        snapshot:
          type: object
          properties:
            id:
              type: string
              format: uuid
            generated_at:
              type: string
              format: date-time
            preliminary:
              type: boolean
        meta:
          type: object
          properties:
            employees_count:
              type: integer
              description: Всего строк после отбора.
            duplicate_days:
              type: integer
            object_config_errors:
              type: integer
            objects_not_frozen:
              type: integer
            export_counts:
              type: object
              description: Только у `GET /staff-month` с `half`.
              properties:
                not_ready:
                  type: integer
                ready:
                  type: integer
                exported:
                  type: integer
                changed:
                  type: integer
            period_ready:
              type: boolean
              description: Только с `half` — половина закончилась, не готовых и неподтверждённых надгробий нет.
        next_cursor:
          type: [string, 'null']
    StaffMonthDay:
      type: object
      properties:
        date:
          type: string
          format: date
        employed:
          type: boolean
        day_kind:
          type: [string, 'null']
          enum: [work, pre_holiday, off, holiday, null]
        working_day:
          type: [boolean, 'null']
        plan_hours:
          type: [number, 'null']
        status_code:
          type: [string, 'null']
          description: Как `DayValue.status`; `null` — дня в табеле нет.
        timesheet_hours:
          type: number
        hours:
          type: number
          description: Факт дня; у неявок 0.
        objects:
          type: array
          items:
            $ref: '#/components/schemas/StaffMonthObjectHours'
        source:
          type: [string, 'null']
          enum: [closed, live, null]
    StaffMonthEmployee:
      type: object
      properties:
        employee_id:
          type: integer
        full_name:
          type: [string, 'null']
        department:
          type: [object, 'null']
          properties:
            id:
              type: string
            name:
              type: string
        category:
          type: string
          enum: [worker, itr, office]
        is_worker:
          type: boolean
        object:
          $ref: '#/components/schemas/StaffMonthObject'
        object_source:
          type: string
          description: Месяц — шаги «Свода»; половина — `hours`, `timesheet_object`, `month`, `unknown`.
          enum: [hours, mode, month_hours, previous_timesheet, previous_hours, department, current_object, timesheet_object, month, unknown]
        timesheet_object:
          type: object
          description: |
            Объект табелирования (объект выполнения) за месяц: `object` — закреплённый объект, `office` — «Офис»,
            `skud` — не закреплён (объекты по дням в `days[].objects`, `object: null`). Прошедший месяц — на конец
            месяца; без личного объекта — по отделу, не фиксируется.
          properties:
            mode:
              type: string
              enum: [object, office, skud]
            object:
              oneOf:
                - $ref: '#/components/schemas/StaffMonthObject'
                - type: 'null'
        objects:
          type: array
          items:
            $ref: '#/components/schemas/StaffMonthObjectHours'
        hours:
          type: number
        norm:
          type: object
          properties:
            hours:
              type: [number, 'null']
            days:
              type: [integer, 'null']
            complete:
              type: boolean
            weekend_quota:
              type: object
              description: Только у месяца (у половины поля нет).
              properties:
                saturdays:
                  type: integer
                sundays:
                  type: integer
                hours:
                  type: number
        brigade:
          type: [object, 'null']
          properties:
            department_id:
              type: string
            name:
              type: string
            object:
              oneOf:
                - $ref: '#/components/schemas/StaffMonthObject'
                - type: 'null'
        preliminary:
          type: boolean
        object_config_error:
          type: boolean
        object_frozen:
          type: boolean
        present:
          type: boolean
          description: Только с `half`. `false` — надгробие, сотрудника больше нет в половине, его строку за половину в ЗУП3 удалить.
        state_revision:
          type: integer
        content_hash:
          type: [string, 'null']
        export_state:
          type: [string, 'null']
          enum: [not_ready, ready, exported, changed, null]
        ready_for_export:
          type: boolean
        last_export:
          type: [object, 'null']
          properties:
            state_revision:
              type: integer
            acked_at:
              type: string
              format: date-time
            document_ref:
              type: [string, 'null']
        days:
          type: array
          description: Только при `days=1`.
          items:
            $ref: '#/components/schemas/StaffMonthDay'
    StaffMonthBrigade:
      type: object
      properties:
        department_id:
          type: string
        name:
          type: string
        object:
          oneOf:
            - $ref: '#/components/schemas/StaffMonthObject'
            - type: 'null'
        objects:
          type: array
          items:
            $ref: '#/components/schemas/StaffMonthObjectHours'
        members:
          type: array
          items:
            type: object
            properties:
              employee_id:
                type: integer
              hours:
                type: number
    StaffMonthObjectTotals:
      type: object
      properties:
        object:
          $ref: '#/components/schemas/StaffMonthObject'
        employees_fact:
          type: integer
        employees_main:
          type: integer
        hours:
          type: number
